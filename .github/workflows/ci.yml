name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Pubb.Server.Tests -c Release
      - run: dotnet build examples/Console -c Release
      - run: dotnet pack src/Pubb.Server -c Release -o artifacts
